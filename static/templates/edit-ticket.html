<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/edit-ticket.css">
    <title>Sistema de Tíquetes</title>
</head>
<body>
    <header>
        <div class="header-return">
            <a href="/static/templates/my-tickets.html">VOLTAR</a>
        </div>
    </header>
    <section class="frame">
        <div class="new-ticket">
            <h1>EDITAR</h1>
            <form id="ticket-edition" action="https://6abae78c5b549d818d62b557.mockapi.io/api/v1/tickets" method="post">
            <input name="title" id="title" type="text" maxlength="20" required>
            <textarea name="description" id="description" maxlength="5" rows="20" class="criar-textarea" required></textarea>
            <div class="form-buttons">
                <button type="submit" class="send-button" name="edit">Enviar →</button>
                <button type="submit" class="delete-button" name="delete">Excluir Tíquete 🗑️</button>
            </div>
            </form>
        </div>
    </section>
    <script src="/static/scripts/edit-ticket.js"></script>
</body>
</html>
